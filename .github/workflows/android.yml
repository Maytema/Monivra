# Builds the Android APKs of the `android-first-apk` branch. Nothing here touches the website, `main`
# or Pages. The result (APKs, checksums, a report of what is inside them, the build log) is committed
# to the branch `android-builds`, which only holds build results.
name: Android build

on:
  push:
    branches: [android-first-apk]
  workflow_dispatch:

permissions:
  contents: read # the jobs that publish build results ask for more themselves

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  web-tests:
    name: Web tests (shared code)
    runs-on: ubuntu-latest
    permissions:
      contents: read # runs the repository's own code and npm packages: no write access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Lint and tests
        run: |
          set -o pipefail
          mkdir -p results
          npx eslint js tests 2>&1 | tee results/lint.log
          node tests/run.mjs 2>&1 | tee results/unit.log
          node tests/scenarios.mjs 2>&1 | tee results/scenarios.log
          node tests/android-mock.mjs 2>&1 | tee results/android-mock.log
          node tests/storage-limits.mjs 2>&1 | tee results/storage-limits.log
          for t in selection pin pdf-cancel statistics scheduled-ui; do node tests/$t.mjs 2>&1 | tee results/$t.log || exit 1; done
      - name: Publish test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-test-logs
          path: results

  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish results to the `android-builds` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        id: build
        env:
          MONIVRA_KEYSTORE_B64: ${{ secrets.MONIVRA_KEYSTORE_B64 }}
          MONIVRA_KEYSTORE_PASSWORD: ${{ secrets.MONIVRA_KEYSTORE_PASSWORD }}
          MONIVRA_KEY_ALIAS: ${{ secrets.MONIVRA_KEY_ALIAS }}
          MONIVRA_KEY_PASSWORD: ${{ secrets.MONIVRA_KEY_PASSWORD }}
        run: |
          set -o pipefail
          bash android-app/scripts/ci-build.sh 2>&1 | tee build.log
      - name: Publish the result to the android-builds branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: bash android-app/scripts/publish-build.sh
      - name: Keep the APKs for the emulator job
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: android-app/dist/*.apk
          retention-days: 3

  emulator:
    name: Emulator test (Android 14)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # to publish the emulator results to the `android-builds` branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: android-app/dist
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on the emulator
        id: emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6144M
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash android-app/scripts/emulator-test.sh
      - name: Publish the emulator results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.emulator.outcome }}
          PUBLISH_DIR: emulator-results
          PUBLISH_FROM: android-app/emulator-results
        run: bash android-app/scripts/publish-build.sh
