# The React Native application in mobile/: types, tests (including parity with the first
# application's code), and a release APK. The APK is signed with the build's debug key; it is
# re-signed with the owner's test key outside CI, as the first application's builds are.
name: Mobile (React Native)

on:
  push:
    branches: [rn-migration]
    paths: ["mobile/**", "!mobile/**/*.md", ".github/workflows/mobile.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            # Versions come from package.json (taken from build 5); Expo adds any new package at the version of its SDK.
            npm install --no-audit --no-fund
            npx expo install expo-router expo-sqlite expo-document-picker expo-file-system expo-sharing expo-crypto \
              expo-localization expo-status-bar expo-splash-screen expo-constants expo-linking react-native-svg \
              react-native-safe-area-context react-native-screens expo-notifications expo-task-manager expo-background-task expo-secure-store expo-local-authentication expo-build-properties react react-dom react-native
          fi
      - name: Dependency versions match the Expo SDK
        run: npx expo install --check
        continue-on-error: true
      - name: Tests (domain, database, rates, store, parity with the first application)
        run: npm test
      - name: Types
        id: types
        run: npx tsc --noEmit -p tsconfig.json
        continue-on-error: true
      - name: Keep package files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-files
          path: |
            mobile/package.json
            mobile/package-lock.json
      - name: Android project
        run: npx expo prebuild --platform android --no-install --clean
        env:
          MONIVRA_VERSION_CODE: ${{ github.run_number }}
      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
      - name: Keep the APK
        uses: actions/upload-artifact@v4
        with:
          name: monivra-rn-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
      - name: Fail when types are wrong
        if: steps.types.outcome == 'failure'
        run: exit 1

  emulator:
    name: Smoke test on the Android emulator
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monivra-rn-apk
          path: results-apk
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6144M
          disable-animations: true
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash mobile/scripts/emulator-smoke.sh
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-results
          path: emulator-results

  # A separate job publishes the results to the `mobile-builds` branch (new commits only, never a
  # forced push). It runs no npm code, so only it holds a token that can write.
  publish:
    name: Publish the APK to the mobile-builds branch
    needs: [build, emulator]
    if: always() && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
        continue-on-error: true
      - name: Commit the results
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          EMULATOR_RESULT: ${{ needs.emulator.result }}
        run: |
          set -e
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$REPO_URL" mobile-builds >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch mobile-builds "$REPO_URL" out
          else
            git init --quiet -b mobile-builds out && git -C out remote add origin "$REPO_URL"
          fi
          dir="out/builds/${GITHUB_RUN_NUMBER}"
          mkdir -p "$dir"
          cp results/package-files/* "$dir"/ 2>/dev/null || true
          if [ -d results/emulator-results ]; then mkdir -p "$dir/emulator" && cp results/emulator-results/* "$dir/emulator"/ 2>/dev/null || true; fi
          for apk in results/monivra-rn-apk/*.apk; do
            [ -f "$apk" ] && cp "$apk" "$dir/RESIGN-ONLY-monivra-rn-${GITHUB_RUN_NUMBER}.apk"
          done
          (cd "$dir" && { sha256sum *.apk 2>/dev/null || true; } > SHA256SUMS && printf 'commit %s\nbuild %s\nemulator %s\n' "$GITHUB_SHA" "$BUILD_RESULT" "$EMULATOR_RESULT" > BUILD.txt)
          cd out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "mobile build ${GITHUB_RUN_NUMBER} (${BUILD_RESULT}) from ${GITHUB_SHA}" || exit 0
          for i in 1 2 3; do git push --quiet origin HEAD:mobile-builds && exit 0; git pull --quiet --rebase origin mobile-builds || true; done
          exit 1
