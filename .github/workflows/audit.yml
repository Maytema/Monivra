# Audit: the first application (Capacitor/WebView) and the React Native application measured side by side on one
# Android emulator, with the same data file and the same moves (tools/audit/compare.mjs). Release builds of both:
# the first application's own CI build script (signed with a key made for this run only, for the emulator), and
# the React Native release build without the speed-check instrumentation. Runs only from the audit branch or by
# hand; it publishes its results to the `audit-results` branch (new commits only, never a forced push).
name: Audit (old vs RN on one emulator)

on:
  push:
    branches: [audit/parity-performance]
    paths: ["tools/audit/**", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  old:
    name: Build the first application (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build (no owner key: a key made for this run only)
        run: bash android-app/scripts/ci-build.sh
      - name: Size of the parts of the APK
        run: |
          apk=$(ls android-app/dist/monivra-*[0-9].apk | head -1)
          { echo "apk $(stat -c %s "$apk") bytes"; unzip -lv "$apk" | awk '{print $1, $3, $8}' | sort -rn | head -30; } > android-app/dist/apk-size-old.txt
          cp android-app/dist/build-report.txt android-app/dist/build-report-old.txt 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: old-apk
          path: |
            android-app/dist/monivra-*[0-9].apk
            android-app/dist/apk-size-old.txt
            android-app/dist/build-report-old.txt

  rn:
    name: Build the React Native application (release, x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies (as mobile.yml: there is no lock file)
        run: |
          npm install --no-audit --no-fund
          npx expo install expo-router expo-sqlite expo-document-picker expo-file-system expo-sharing expo-crypto \
            expo-localization expo-status-bar expo-splash-screen expo-constants expo-linking react-native-svg \
            react-native-safe-area-context react-native-screens expo-notifications expo-task-manager expo-background-task expo-secure-store expo-local-authentication expo-build-properties react react-dom react-native
      - name: Android project
        run: npx expo prebuild --platform android --no-install --clean
      - name: Build release APK (no speed-check instrumentation)
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Size of the parts of the APK
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          { echo "apk $(stat -c %s "$apk") bytes (x86_64)"; unzip -lv "$apk" | awk '{print $1, $3, $8}' | sort -rn | head -30; } > android/app/build/outputs/apk/release/apk-size-rn-x86_64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rn-apk
          path: |
            mobile/android/app/build/outputs/apk/release/*.apk
            mobile/android/app/build/outputs/apk/release/apk-size-rn-x86_64.txt

  compare:
    name: Both applications on one emulator
    needs: [old, rn]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: apks
      - name: The data file (3000 operations over 18 months, fixed seed)
        run: node mobile/scripts/perf-data.mjs 3000 18 > perf-data.json
      - name: Allow the emulator to use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6144M
          disable-animations: false
          emulator-options: -no-window -no-snapshot-save -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash tools/audit/run-compare.sh
      - name: Keep the sizes
        if: always()
        run: cp apks/old-apk/*.txt apks/rn-apk/*.txt audit-results/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-results
          path: audit-results

  publish:
    name: Publish to the audit-results branch
    needs: [compare]
    if: always() && needs.compare.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: audit-results
          path: audit-results
        continue-on-error: true
      - name: Commit the results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          git init -q work && cd work
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin audit-results; then git checkout -q -b audit-results FETCH_HEAD; else git checkout -q --orphan audit-results; fi
          mkdir -p "runs/${GITHUB_RUN_NUMBER}" && cp -r ../audit-results/. "runs/${GITHUB_RUN_NUMBER}/" 2>/dev/null || true
          echo "run ${GITHUB_RUN_ID}, commit ${GITHUB_SHA}, compare: ${{ needs.compare.result }}" > "runs/${GITHUB_RUN_NUMBER}/RUN.txt"
          git add -A
          git -c user.name="audit-bot" -c user.email="audit-bot@users.noreply.github.com" commit -q -m "Audit results of run ${GITHUB_RUN_NUMBER}"
          git push -q origin audit-results
